[package]
name = "isabelle-ablator-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.isabelle-ablator]
path = ".."
default-features = false

[[bin]]
name = "parse_roundtrip"
path = "fuzz_targets/parse_roundtrip.rs"
test = false
doc = false
bench = false

# isolate from the parent (no workspace)
[workspace]

[profile.release]
debug = 1
